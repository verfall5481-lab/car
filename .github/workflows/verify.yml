name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
      - run: npm install --global pnpm@10.26.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @deriro/contracts test:sql
      - run: pnpm build
      - run: pnpm --filter @deriro/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
